<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="manifest.open_in_tab" content="true" />
        <title>Tabdrift :: Settings</title>
        <style>
            :root {
                color-scheme: dark;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    Helvetica, Arial, sans-serif;
                background: #161618;
                color: #f1f1f3;
                display: flex;
                justify-content: center;
                padding: 48px 20px;
            }
            main {
                width: 420px;
            }
            h1 {
                font-size: 20px;
                margin: 0 0 4px;
            }
            p.sub {
                color: rgba(255, 255, 255, 0.5);
                margin: 0 0 28px;
                font-size: 13px;
            }
            .field {
                margin-bottom: 22px;
            }
            label {
                display: block;
                font-size: 13px;
                font-weight: 600;
                margin-bottom: 8px;
            }
            fieldset {
                border: none;
                margin: 0;
                padding: 0;
            }
            legend {
                font-size: 13px;
                font-weight: 600;
                margin-bottom: 8px;
                padding: 0;
            }
            .hint {
                font-size: 12px;
                color: rgba(255, 255, 255, 0.45);
                margin-top: 6px;
            }
            #shortcut-input {
                width: 100%;
                padding: 11px 14px;
                border-radius: 8px;
                border: 1px solid rgba(255, 255, 255, 0.15);
                background: rgba(255, 255, 255, 0.05);
                color: #fff;
                font-size: 14px;
                cursor: pointer;
                text-align: center;
                letter-spacing: 0.02em;
            }
            #shortcut-input.recording {
                border-color: var(--accent, #3b82f6);
                background: rgba(59, 130, 246, 0.12);
            }
            .position-options {
                display: flex;
                gap: 10px;
            }
            .position-options label {
                flex: 1;
                margin: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                padding: 10px 0;
                border-radius: 8px;
                border: 1px solid rgba(255, 255, 255, 0.15);
                background: rgba(255, 255, 255, 0.04);
                font-size: 13px;
                font-weight: 500;
                cursor: pointer;
            }
            .position-options input {
                accent-color: var(--accent, #3b82f6);
            }
            .position-options label:has(input:checked) {
                border-color: var(--accent, #3b82f6);
                background: color-mix(
                    in srgb,
                    var(--accent, #3b82f6) 20%,
                    transparent
                );
            }
            input[type="color"] {
                width: 48px;
                height: 36px;
                border: none;
                border-radius: 8px;
                background: none;
                cursor: pointer;
            }
            .accent-row {
                display: flex;
                align-items: center;
                gap: 12px;
            }
            #accent-value {
                font-size: 13px;
                color: rgba(255, 255, 255, 0.6);
            }
            button#save {
                width: 100%;
                padding: 12px;
                border: none;
                border-radius: 8px;
                background: var(--accent, #3b82f6);
                color: #fff;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                margin-top: 10px;
            }
            button#save:active {
                transform: scale(0.99);
            }
            #status {
                text-align: center;
                font-size: 12.5px;
                color: rgba(255, 255, 255, 0.5);
                margin-top: 10px;
                height: 16px;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Tabdrift</h1>
            <p class="sub">
                Configure the shortcut, overlay position, and accent color.
            </p>

            <div class="field">
                <label for="shortcut-input">Keyboard shortcut</label>
                <input
                    id="shortcut-input"
                    type="text"
                    readonly
                    value="Alt+Shift+K"
                />
                <div class="hint">
                    Click, then press your new combo. Needs Ctrl or Alt plus a
                    key.
                </div>
            </div>

            <fieldset class="field">
                <legend>Overlay position</legend>
                <div class="position-options">
                    <label
                        ><input type="radio" name="position" value="top" />
                        Top</label
                    >
                    <label
                        ><input
                            type="radio"
                            name="position"
                            value="center"
                            checked
                        />
                        Center</label
                    >
                    <label
                        ><input type="radio" name="position" value="bottom" />
                        Bottom</label
                    >
                </div>
            </fieldset>

            <div class="field">
                <label for="accent-input">Accent color</label>
                <div class="accent-row">
                    <input id="accent-input" type="color" value="#3b82f6" />
                    <span id="accent-value">#3b82f6</span>
                </div>
            </div>

            <button id="save" type="button">Save settings</button>
            <div id="status"></div>
        </main>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
